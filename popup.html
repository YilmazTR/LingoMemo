
<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { width: 320px; margin: 0; font-family: 'Segoe UI', sans-serif; background: #F8F9FA; color: #2C3E50; }
        header { background: #4A90E2; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: white; padding: 12px 15px; border-bottom: 1px solid #EDF2F7; }
        .word-item { display: flex; justify-content: space-between; align-items: center; }
        .word { font-weight: 700; font-size: 15px; color: #2C3E50; }
        .tr-meaning { font-size: 14px; color: #27AE60; font-weight: 500; }
        .def { font-size: 12px; color: #7F8C8D; margin-top: 4px; line-height: 1.3; }
        .footer-actions { padding: 10px; background: #F8F9FA; border-top: 1px solid #EDF2F7; display: flex; gap: 10px; }
        .btn-dashboard { flex: 1; padding: 8px; background: white; border: 1px solid #4A90E2; color: #4A90E2; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-dashboard:hover { background: #4A90E2; color: white; }
        footer { padding: 10px; text-align: center; font-size: 11px; color: #BDC3C7; }
    </style>
</head>
<body>
    <header>📚 My Vocab</header>
    <ul id="word-list"></ul>
    <div class="footer-actions">
        <button class="btn-dashboard" id="btn-go-dashboard">📊 View Dashboard</button>
    </div>
    <footer>LingoMemo v1.2</footer>
    <script src="popup.js"></script>
    <script>
        document.getElementById('btn-go-dashboard').onclick = () => {
            chrome.tabs.create({ url: 'dashboard.html' });
        };
    </script>
</body>
</html>
